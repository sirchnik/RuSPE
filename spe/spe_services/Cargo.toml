[package]
name = "spe_services"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
default = ["rustcrypto"]
rustcrypto = ["dep:p256", "dep:sha2", "dep:signature"]

# The `unsafe_mbedtls` feature relies on the mbedtls C-FFI.
# It is marked as unsafe for two reasons:
# 1. It utilizes C-FFI, requiring multiple unsafe blocks.
# 2. It uses a dummy RNG (no real RNG), rendering it cryptographically insecure for production use.
unsafe_mbedtls = [
    "dep:mbedtls-rs",
    "mbedtls-rs/alg-sha256",
    "mbedtls-rs/alg-ecp",
    "mbedtls-rs/alg-ecdsa",
    "mbedtls-rs/curve-secp256r1",
    "mbedtls-rs/nohook",
    "mbedtls-rs/nohook-sha256",
    "mbedtls-rs/nohook-exp-mod",
]

[dependencies]
spe = { path = "../spe" }
minicbor = { version = "2.2.1", default-features = false }
p256 = { version = "0.13.2", features = [
    "ecdsa",
    "ecdh",
], default-features = false, optional = true }
sha2 = { version = "0.10.9", default-features = false, optional = true }
signature = { version = "2.2.0", default-features = false, optional = true }
bytemuck = { version = "1.25.0", features = ["derive"] }
psa_interface = { path = "../psa_interface" }
helpers = { path = "../../libraries/helpers" }
cose = { path = "../../libraries/cose" }
mbedtls-rs = { version = "0.1.0", default-features = false, optional = true }

[dev-dependencies]
sha2 = { version = "0.10.9", default-features = false }

[lints]
workspace = true
